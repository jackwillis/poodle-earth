name: NetBSD macppc tools

# First Linux-hosted NetBSD 11.1/macppc slice: build.sh tools from pinned source sets, cold.
# No sysroot, application build, package assembly, G4 access or publication. Manual or on a PR
# that changes the inputs; nothing here is a required status or a scheduled job.
on:
  pull_request:
    paths:
      - '.github/workflows/netbsd-macppc-tools.yml'
      - 'packaging/netbsd-macppc/**'
      - 'tools/netbsd-macppc-tools.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: build.sh tools (NetBSD 11.1, macppc) on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install host build requirements
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential zlib1g-dev curl ca-certificates
      # No cache action is used anywhere in this job: every run starts from an empty WORK.
      - name: Fetch, verify and build tools
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: tools/netbsd-macppc-tools.sh "$RUNNER_TEMP/macppc-work"
      - name: Job summary
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/macppc-work/summary.md" ] && cat "$RUNNER_TEMP/macppc-work/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netbsd-11.1-macppc-tools-logs
          path: |
            ${{ runner.temp }}/macppc-work/logs/
            ${{ runner.temp }}/macppc-work/summary.md
          if-no-files-found: warn
          retention-days: 30
